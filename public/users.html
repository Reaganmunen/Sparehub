<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Users & roles | Spare Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/app.css" rel="stylesheet">
<link href="css/dashboard.css" rel="stylesheet">
<link href="css/products.css" rel="stylesheet">
<link href="css/pos.css" rel="stylesheet">
<link href="css/pages.css" rel="stylesheet">
</head>
<body class="app-body">
<div class="app">
  <aside id="sidebar" class="side offcanvas-lg offcanvas-start" tabindex="-1"></aside>
  <main class="main">
    <header class="topbar">
      <button class="btn btn-sm d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-label="Open menu"><i class="bi bi-list fs-4"></i></button>
      <div class="crumb">Management <i class="bi bi-chevron-right small"></i> <b>Users & roles</b></div>
    </header>
    <div class="page">
      <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between">
        <h1 class="h3 m-0 fw-semibold">Users & roles</h1>
        <div class="d-flex flex-wrap gap-2" id="headActions"><button id="addBtn" class="btn btn-ink btn-sm px-3"><i class="bi bi-plus-lg me-1"></i>Add person</button></div>
      </div>
      <div id="notice"></div>
      <div class="panel">
        <div class="panel-h flex-wrap">
          <span class="label-mono">People <span id="total"></span></span>
          <div class="d-flex flex-wrap gap-2 align-items-center">
            <input id="fSearch" class="form-control form-control-sm tx-search" style="width:180px" placeholder="Name or username" aria-label="Search people">
            <select id="fRole" class="form-select form-select-sm pill-select" aria-label="Role"><option value="">All roles</option><option value="owner">Owner</option><option value="manager">Manager</option><option value="cashier">Cashier</option></select>
            <select id="fActive" class="form-select form-select-sm pill-select" aria-label="Status"><option value="true" selected>Active</option><option value="false">Switched off</option><option value="">All</option></select>
          </div>
        </div>
        <div class="table-responsive panel-b p-0"><table class="table align-middle mb-0 tx">
          <thead><tr><th>Person</th><th>Role</th><th>Shop</th><th>Permissions</th><th>Last login</th><th></th></tr></thead>
          <tbody id="tbody"></tbody></table></div>
      </div>
    </div>
  </main>
</div>
<div class="modal fade" id="uModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered "><div class="modal-content pm">
    <div class="modal-header"><h2 class="modal-title h5 m-0" id="uModalTitle">Add person</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body"><div id="uModalErr" class="alert-x d-none mb-3"></div>
      <div class="row g-3">
        <div class="col-12"><label class="form-label" for="uName">Full name *</label><input id="uName" class="form-control" autocomplete="off"></div>
        <div class="col-6"><label class="form-label" for="uUser">Username *</label><input id="uUser" class="form-control mono" autocomplete="off" autocapitalize="none"></div>
        <div class="col-6 d-none" id="uPassBox"><label class="form-label" for="uPass">Starting password *</label><input id="uPass" type="text" class="form-control mono" autocomplete="off" placeholder="They change it at first login"></div>
        <div class="col-6"><label class="form-label" for="uPhone">Phone</label><input id="uPhone" class="form-control mono" inputmode="tel" autocomplete="off"></div>
        <div class="col-6"><label class="form-label" for="uEmail">Email</label><input id="uEmail" type="email" class="form-control" autocomplete="off"></div>
        <div class="col-6"><label class="form-label" for="uRole">Role *</label><select id="uRole" class="form-select"><option value="cashier">Cashier</option><option value="manager">Manager</option><option value="owner">Owner</option></select></div>
        <div class="col-6" id="uShopBox"><label class="form-label" for="uShop">Shop *</label><select id="uShop" class="form-select"></select></div>
        <div class="col-6"><label class="form-label" for="uDisc">Biggest discount allowed (%)</label><input id="uDisc" type="number" min="0" max="100" step="1" class="form-control mono"></div>
        <div class="col-12"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="uOverride"><label class="form-check-label" for="uOverride">Can sell below the minimum price</label></div></div>
        <div class="col-12"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="uCosts"><label class="form-check-label" for="uCosts">Can see buying costs and profit</label></div></div>
        <div class="col-12 d-none" id="uActiveBox"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="uActive" checked><label class="form-check-label" for="uActive">Account is active</label></div></div>
      </div>
    </div>
    <div class="modal-footer"><button class="btn btn-light border" data-bs-dismiss="modal">Cancel</button><button id="uSave" class="btn btn-ink px-4">Save</button></div>
  </div></div>
</div>
<div class="modal fade" id="pwModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered "><div class="modal-content pm">
    <div class="modal-header"><h2 class="modal-title h5 m-0" id="pwModalTitle">Reset password</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body"><div id="pwModalErr" class="alert-x d-none mb-3"></div>
      <div class="mb-3">Choose a new password for <b id="pwWho"></b>. They will be asked to pick their own the next time they sign in.</div>
      <label class="form-label" for="pwNew">New password *</label><input id="pwNew" type="text" class="form-control mono" autocomplete="off">
    </div>
    <div class="modal-footer"><button class="btn btn-light border" data-bs-dismiss="modal">Cancel</button><button id="pwSave" class="btn btn-ink px-4">Reset password</button></div>
  </div></div>
</div>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/util.js"></script>
<script src="js/users.js"></script>
</body>
</html>
