<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogue | Spare Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/app.css" rel="stylesheet">
<link href="css/dashboard.css" rel="stylesheet">
<link href="css/products.css" rel="stylesheet">
<link href="css/pos.css" rel="stylesheet">
<link href="css/pages.css" rel="stylesheet">
</head>
<body class="app-body">
<div class="app">
  <aside id="sidebar" class="side offcanvas-lg offcanvas-start" tabindex="-1"></aside>
  <main class="main">
    <header class="topbar">
      <button class="btn btn-sm d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-label="Open menu"><i class="bi bi-list fs-4"></i></button>
      <div class="crumb">Management <i class="bi bi-chevron-right small"></i> <b>Catalogue</b></div>
    </header>
    <div class="page">
      <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between">
        <h1 class="h3 m-0 fw-semibold">Catalogue</h1>
        <div class="d-flex flex-wrap gap-2" id="headActions"></div>
      </div>
      <div id="notice"></div>
      <div class="tabs-x" id="tabs"></div>
      <div class="panel">
        <div class="panel-h flex-wrap">
          <span class="label-mono" id="cTitle">Items</span>
          <div class="d-flex flex-wrap gap-2 align-items-center">
            <input id="cSearch" class="form-control form-control-sm tx-search" style="width:180px" placeholder="Search" aria-label="Search">
            <select id="cActiveF" class="form-select form-select-sm pill-select" aria-label="Status"><option value="true" selected>Active</option><option value="false">Switched off</option><option value="">All</option></select>
            <button id="addBtn" class="btn btn-ink btn-sm px-3"><i class="bi bi-plus-lg me-1"></i><span id="addLabel">Add</span></button>
          </div>
        </div>
        <div class="table-responsive panel-b p-0"><table class="table align-middle mb-0 tx"><thead id="cHead"></thead><tbody id="cBody"></tbody></table></div>
      </div>
    </div>
  </main>
</div>
<div class="modal fade" id="cModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered "><div class="modal-content pm">
    <div class="modal-header"><h2 class="modal-title h5 m-0" id="cModalTitle">Add</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body"><div id="cModalErr" class="alert-x d-none mb-3"></div>
      <div class="row g-3" id="cFields"></div><datalist id="vtList"></datalist>
    </div>
    <div class="modal-footer"><button class="btn btn-light border" data-bs-dismiss="modal">Cancel</button><button id="cSave" class="btn btn-ink px-4">Save</button></div>
  </div></div>
</div>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/util.js"></script>
<script src="js/catalogue.js"></script>
</body>
</html>
