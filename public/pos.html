<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Point of sale | Spare Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/app.css" rel="stylesheet">
<link href="css/dashboard.css" rel="stylesheet">
<link href="css/pos.css" rel="stylesheet">
</head>
<body class="app-body">
<div class="app">
  <aside id="sidebar" class="side offcanvas-lg offcanvas-start" tabindex="-1"></aside>
  <main class="main">
    <header class="topbar">
      <button class="btn btn-sm d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-label="Open menu"><i class="bi bi-list fs-4"></i></button>
      <div class="crumb">Main menu <i class="bi bi-chevron-right small"></i> <b>Point of sale</b></div>
      <div class="ms-auto d-flex align-items-center gap-2">
        <span id="shiftChip" class="d-none"></span>
        <button id="heldBtn" class="btn btn-sm btn-light border"><i class="bi bi-pause-circle me-1"></i>Held <span id="heldCount" class="pill-count ms-1">0</span></button>
      </div>
    </header>

    <div class="page">
      <div id="notice" class="d-none"></div>
      <div class="pos">
        <!-- ============ products ============ -->
        <section class="panel">
          <div class="panel-h"><span class="label-mono">Products</span><span class="small text-muted" id="resultInfo"></span></div>
          <div class="panel-b">
            <div class="d-flex flex-wrap gap-2 mb-3">
              <label class="search flex-grow-1 m-0" style="width:auto;margin-left:0">
                <i class="bi bi-upc-scan"></i>
                <input id="q" placeholder="Scan barcode or search name, SKU, part number" autocomplete="off" autofocus aria-label="Search products">
              </label>
              <select id="cat" class="form-select form-select-sm pill-select" aria-label="Category"><option value="">All categories</option></select>
              <div class="form-check form-switch d-flex align-items-center gap-2 m-0 ps-0">
                <input class="form-check-input ms-0" type="checkbox" id="inStock" role="switch"><label for="inStock" class="small">In stock only</label>
              </div>
            </div>
            <div id="grid" class="grid"></div>
          </div>
        </section>

        <!-- ============ cart ============ -->
        <aside class="panel cart">
          <div class="panel-h">
            <span class="label-mono">Current sale</span>
            <div class="btn-group btn-group-sm" role="group" aria-label="Sale type">
              <input type="radio" class="btn-check" name="stype" id="st-retail" value="retail" checked><label class="btn btn-outline-dark" for="st-retail">Retail</label>
              <input type="radio" class="btn-check" name="stype" id="st-wholesale" value="wholesale"><label class="btn btn-outline-dark" for="st-wholesale">Wholesale</label>
            </div>
          </div>
          <div class="panel-b d-flex flex-column gap-3">
            <div class="position-relative">
              <div id="custChip" class="cust d-none"></div>
              <div id="custPick">
                <input id="custQ" class="form-control form-control-sm" placeholder="Customer (optional): search name or phone" autocomplete="off" aria-label="Customer">
                <div id="custList" class="cust-list d-none"></div>
              </div>
            </div>
            <div id="lines" class="lines"></div>
            <div class="sum">
              <div class="d-flex justify-content-between"><span class="label-mono">Items</span><span class="mono" id="itemCount">0</span></div>
              <div class="d-flex justify-content-between align-items-baseline"><span class="label-mono">Total</span><span class="big mono" id="total">KES 0</span></div>
            </div>
            <input id="notes" class="form-control form-control-sm" placeholder="Note (optional)" aria-label="Note">
            <div class="d-flex gap-2">
              <button id="clearBtn" class="btn btn-light border" title="Clear cart"><i class="bi bi-trash3"></i></button>
              <button id="holdBtn" class="btn btn-light border flex-fill"><i class="bi bi-pause-circle me-1"></i>Hold</button>
              <button id="payBtn" class="btn btn-ink flex-fill py-2" disabled><i class="bi bi-cash-coin me-1"></i>Pay</button>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </main>
</div>

<!-- ============ payment ============ -->
<div class="modal fade" id="payModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Take payment</h5><button class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="payClose"></button></div>
    <div class="modal-body">
      <div class="d-flex justify-content-between align-items-baseline mb-3"><span class="label-mono">Amount due</span><span class="big mono" id="payTotal">KES 0</span></div>
      <div id="payErr" class="alert-x d-none mb-3"></div>

      <div id="payForm">
        <div class="row g-2 mb-2">
          <div class="col-6"><label class="form-label small mb-1">Method</label>
            <select id="pMethod" class="form-select form-select-sm">
              <option value="cash">Cash</option><option value="mpesa_stk">M-Pesa: send prompt to phone</option><option value="mpesa">M-Pesa: I have the code</option>
              <option value="card">Card</option><option value="bank_transfer">Bank transfer</option>
            </select></div>
          <div class="col-6"><label class="form-label small mb-1">Amount</label><input id="pAmount" type="number" min="0" step="1" class="form-control form-control-sm mono"></div>
          <div class="col-12 d-none" id="pRefRow"><label class="form-label small mb-1" id="pRefLabel">Reference</label><input id="pRef" class="form-control form-control-sm mono" autocomplete="off"></div>
        </div>
        <button id="pAdd" class="btn btn-sm btn-light border w-100 mb-3"><i class="bi bi-plus-lg me-1"></i>Add this payment</button>
        <div id="payLines" class="mb-3"></div>
        <div class="sum">
          <div class="d-flex justify-content-between"><span class="label-mono">Paid</span><span class="mono" id="paidSum">KES 0</span></div>
          <div class="d-flex justify-content-between"><span class="label-mono" id="remLabel">Left to pay</span><span class="mono fw-semibold" id="remSum">KES 0</span></div>
          <div class="d-flex justify-content-between d-none" id="changeRow"><span class="label-mono">Change to give</span><span class="mono fw-semibold" id="changeSum">KES 0</span></div>
        </div>
        <div class="small text-muted mt-2 d-none" id="creditNote"></div>
      </div>

      <div id="stkWait" class="text-center py-3 d-none">
        <div class="spinner-border mb-3" role="status"></div>
        <div class="fw-semibold" id="stkMsg">Waiting for the customer to enter their M-Pesa PIN</div>
        <div class="small text-muted" id="stkSub"></div>
        <button id="stkCancel" class="btn btn-sm btn-light border mt-3">Stop waiting</button>
      </div>
    </div>
    <div class="modal-footer" id="payFoot">
      <button class="btn btn-light border" data-bs-dismiss="modal">Cancel</button>
      <button id="confirmPay" class="btn btn-ink px-4" disabled>Complete sale</button>
    </div>
  </div></div>
</div>

<!-- ============ manager approval ============ -->
<div class="modal fade" id="apprModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Manager approval</h5><button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body">
      <p class="small text-muted" id="apprWhy"></p>
      <input id="apprUser" class="form-control form-control-sm mb-2" placeholder="Manager username" autocomplete="off" aria-label="Manager username">
      <input id="apprPass" type="password" class="form-control form-control-sm" placeholder="Password" autocomplete="off" aria-label="Manager password">
      <div id="apprErr" class="small text-danger mt-2 d-none"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-light border" data-bs-dismiss="modal">Cancel</button><button id="apprOk" class="btn btn-ink">Approve</button></div>
  </div></div>
</div>

<!-- ============ held carts ============ -->
<div class="modal fade" id="heldModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Held sales</h5><button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body" id="heldBody"></div>
  </div></div>
</div>

<!-- ============ shift ============ -->
<div class="modal fade" id="shiftModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="shiftTitle">Open your shift</h5><button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body">
      <div id="shiftInfo" class="small text-muted mb-2"></div>
      <label class="form-label small mb-1" id="shiftLabel">Cash in the till now</label>
      <input id="shiftCash" type="number" min="0" step="1" class="form-control form-control-sm mono" value="0">
      <input id="shiftNotes" class="form-control form-control-sm mt-2 d-none" placeholder="Notes (optional)" aria-label="Shift notes">
      <div id="shiftErr" class="small text-danger mt-2 d-none"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-light border" data-bs-dismiss="modal">Cancel</button><button id="shiftOk" class="btn btn-ink">Open shift</button></div>
  </div></div>
</div>

<!-- ============ new customer ============ -->
<div class="modal fade" id="custModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">New customer</h5><button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body">
      <input id="ncName" class="form-control form-control-sm mb-2" placeholder="Name" aria-label="Customer name">
      <input id="ncPhone" class="form-control form-control-sm" placeholder="Phone (07xx xxx xxx)" inputmode="tel" aria-label="Customer phone">
      <div id="ncErr" class="small text-danger mt-2 d-none"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-light border" data-bs-dismiss="modal">Cancel</button><button id="ncOk" class="btn btn-ink">Save</button></div>
  </div></div>
</div>

<!-- ============ receipt ============ -->
<div class="modal fade" id="rcptModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-sm"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title"><i class="bi bi-check-circle-fill text-success me-2"></i>Sale complete</h5></div>
    <div class="modal-body"><pre id="rcptText" class="rcpt"></pre><div id="rcptNote" class="small text-muted mt-2 d-none"></div></div>
    <div class="modal-footer justify-content-between">
      <div class="d-flex gap-2"><button id="rcptPrint" class="btn btn-sm btn-light border"><i class="bi bi-printer me-1"></i>Print</button>
        <a id="rcptWa" class="btn btn-sm btn-light border d-none" target="_blank" rel="noopener"><i class="bi bi-whatsapp me-1"></i>WhatsApp</a></div>
      <button class="btn btn-ink btn-sm px-3" data-bs-dismiss="modal" id="rcptDone">New sale</button>
    </div>
  </div></div>
</div>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/offline.js" id="offlineJs"></script>
<script src="js/pos.js"></script>
</body>
</html>
