<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity log | Spare Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/app.css" rel="stylesheet">
<link href="css/dashboard.css" rel="stylesheet">
<link href="css/products.css" rel="stylesheet">
<link href="css/pos.css" rel="stylesheet">
<link href="css/pages.css" rel="stylesheet">
</head>
<body class="app-body">
<div class="app">
  <aside id="sidebar" class="side offcanvas-lg offcanvas-start" tabindex="-1"></aside>
  <main class="main">
    <header class="topbar">
      <button class="btn btn-sm d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-label="Open menu"><i class="bi bi-list fs-4"></i></button>
      <div class="crumb">Management <i class="bi bi-chevron-right small"></i> <b>Activity log</b></div>
    </header>
    <div class="page">
      <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between">
        <h1 class="h3 m-0 fw-semibold">Activity log</h1>
        <div class="d-flex flex-wrap gap-2" id="headActions"></div>
      </div>
      <div id="notice"></div>
      <div class="panel">
        <div class="panel-h flex-wrap">
          <span class="label-mono">Who did what <span id="total"></span></span>
          <div class="d-flex flex-wrap gap-2 align-items-center">
            <input id="fAction" class="form-control form-control-sm tx-search" style="width:170px" placeholder="Action, e.g. sale.void" aria-label="Action">
            <select id="fType" class="form-select form-select-sm pill-select" aria-label="What it was done to"><option value="">Everything</option></select>
            <select id="fUser" class="form-select form-select-sm pill-select" aria-label="Person"><option value="">Everyone</option></select>
            <input type="date" id="fFrom" class="form-control form-control-sm" style="width:150px" aria-label="From date">
            <input type="date" id="fTo" class="form-control form-control-sm" style="width:150px" aria-label="To date">
          </div>
        </div>
        <div class="table-responsive panel-b p-0"><table class="table align-middle mb-0 tx">
          <thead><tr><th>When</th><th>Person</th><th>Action</th><th>On</th><th>Shop</th><th></th></tr></thead>
          <tbody id="tbody"></tbody></table></div>
        <div class="d-flex justify-content-between align-items-center px-3 py-2">
          <small class="text-muted mono" id="pageInfo"></small>
          <div class="btn-group btn-group-sm"><button class="btn btn-light border" id="prevBtn" aria-label="Previous page"><i class="bi bi-chevron-left"></i></button><button class="btn btn-light border" id="nextBtn" aria-label="Next page"><i class="bi bi-chevron-right"></i></button></div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/util.js"></script>
<script src="js/audit.js"></script>
</body>
</html>
