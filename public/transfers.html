<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop transfers | Spare Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/app.css" rel="stylesheet">
<link href="css/dashboard.css" rel="stylesheet">
<link href="css/products.css" rel="stylesheet">
<link href="css/pos.css" rel="stylesheet">
</head>
<body class="app-body">
<div class="app">
  <aside id="sidebar" class="side offcanvas-lg offcanvas-start" tabindex="-1"></aside>
  <main class="main">
    <header class="topbar">
      <button class="btn btn-sm d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-label="Open menu"><i class="bi bi-list fs-4"></i></button>
      <div class="crumb">People & suppliers <i class="bi bi-chevron-right small"></i> <b>Shop transfers</b></div>
    </header>

    <div class="page">
      <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between">
        <h1 class="h3 m-0 fw-semibold">Shop transfers</h1>
        <button id="addBtn" class="btn btn-ink btn-sm px-3"><i class="bi bi-plus-lg me-1"></i>New transfer</button>
      </div>
      <div id="notice"></div>

      <div class="panel">
        <div class="panel-h flex-wrap">
          <span class="label-mono">Stock moved between shops <span id="total"></span></span>
          <select id="fStatus" class="form-select form-select-sm pill-select" aria-label="Status">
            <option value="">All statuses</option><option value="requested">Requested</option><option value="dispatched">On the way</option><option value="received">Received</option><option value="cancelled">Cancelled</option>
          </select>
        </div>
        <div class="table-responsive panel-b p-0"><table class="table align-middle mb-0 tx">
          <thead><tr><th>Transfer</th><th>From</th><th>To</th><th class="text-end">Products</th><th>Status</th><th></th></tr></thead>
          <tbody id="tbody"></tbody></table></div>
        <div class="d-flex justify-content-between align-items-center px-3 py-2">
          <small class="text-muted mono" id="pageInfo"></small>
          <div class="btn-group btn-group-sm"><button class="btn btn-light border" id="prevBtn" aria-label="Previous page"><i class="bi bi-chevron-left"></i></button><button class="btn btn-light border" id="nextBtn" aria-label="Next page"><i class="bi bi-chevron-right"></i></button></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- ============ new transfer ============ -->
<div class="modal fade" id="fModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content pm">
    <div class="modal-header"><h2 class="modal-title h5 m-0">New transfer</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body">
      <div id="fErr" class="alert-x d-none mb-3"></div>
      <div class="row g-3">
        <div class="col-12 d-none" id="fDirBox">
          <div class="btn-group btn-group-sm w-100" role="group" aria-label="Direction">
            <input type="radio" class="btn-check" name="dir" id="dir-ask" value="ask" checked><label class="btn btn-outline-dark" for="dir-ask">Ask the other shop to send me stock</label>
            <input type="radio" class="btn-check" name="dir" id="dir-send" value="send"><label class="btn btn-outline-dark" for="dir-send">I am sending stock to the other shop</label>
          </div>
        </div>
        <div class="col-6"><label class="form-label" for="fFrom">From shop (sends)</label><select id="fFrom" class="form-select"></select></div>
        <div class="col-6"><label class="form-label" for="fTo">To shop (receives)</label><select id="fTo" class="form-select"></select></div>
        <div class="col-12"><hr class="my-1"><span class="label-mono">Products to move</span>
          <div class="position-relative mt-2"><input id="fFind" class="form-control" placeholder="Search product by name, SKU or part number" autocomplete="off" aria-label="Find product"><div id="fFindList" class="cust-list d-none"></div></div>
          <div class="table-responsive mt-2"><table class="table table-sm align-middle tx mb-0"><thead><tr><th>Product</th><th class="text-end">At sending shop</th><th style="width:120px">Quantity</th><th style="width:40px"></th></tr></thead><tbody id="fLines"></tbody></table></div>
        </div>
        <div class="col-12"><label class="form-label" for="fNotes">Notes</label><input id="fNotes" class="form-control" autocomplete="off"></div>
      </div>
    </div>
    <div class="modal-footer"><button class="btn btn-light border" data-bs-dismiss="modal">Cancel</button><button id="fSave" class="btn btn-ink px-4">Create transfer</button></div>
  </div></div>
</div>

<!-- ============ view one transfer ============ -->
<div class="modal fade" id="vModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content pm">
    <div class="modal-header"><h2 class="modal-title h5 m-0" id="vTitle">Transfer</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body">
      <div id="vErr" class="alert-x d-none mb-3"></div>
      <div id="vHead"></div>
      <div class="table-responsive"><table class="table table-sm align-middle tx"><thead id="vThead"></thead><tbody id="vLines"></tbody></table></div>
      <div id="vHelp" class="small text-muted"></div>
      <div id="vNotes" class="small text-muted mt-2"></div>
    </div>
    <div class="modal-footer justify-content-between flex-wrap gap-2">
      <div class="d-flex gap-2"><button id="vPrint" class="btn btn-sm btn-light border"><i class="bi bi-printer me-1"></i>Print slip</button>
        <button id="vCancel" class="btn btn-sm btn-light border text-danger d-none"><i class="bi bi-x-octagon me-1"></i>Cancel transfer</button></div>
      <div class="d-flex gap-2"><button id="vDispatch" class="btn btn-sm btn-ink d-none"><i class="bi bi-truck me-1"></i>Send the stock</button>
        <button id="vReceive" class="btn btn-sm btn-ink d-none"><i class="bi bi-box-arrow-in-down me-1"></i>Confirm stock arrived</button></div>
    </div>
  </div></div>
</div>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/transfers.js"></script>
</body>
</html>
