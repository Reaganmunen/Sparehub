<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports | Spare Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/app.css" rel="stylesheet">
<link href="css/dashboard.css" rel="stylesheet">
<link href="css/products.css" rel="stylesheet">
<link href="css/pos.css" rel="stylesheet">
<link href="css/pages.css" rel="stylesheet">
</head>
<body class="app-body">
<div class="app">
  <aside id="sidebar" class="side offcanvas-lg offcanvas-start" tabindex="-1"></aside>
  <main class="main">
    <header class="topbar">
      <button class="btn btn-sm d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-label="Open menu"><i class="bi bi-list fs-4"></i></button>
      <div class="crumb">Management <i class="bi bi-chevron-right small"></i> <b>Reports</b></div>
    </header>
    <div class="page">
      <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between">
        <h1 class="h3 m-0 fw-semibold">Reports</h1>
        <div class="d-flex flex-wrap gap-2" id="headActions"></div>
      </div>
      <div id="notice"></div>
      <div class="panel d-none" id="reviewPanel">
        <div class="panel-h"><span class="label-mono">M-Pesa payments that need a look <span class="pill-count" id="reviewCount"></span></span></div>
        <div class="panel-b p-0"><div class="table-responsive"><table class="table align-middle mb-0 tx"><thead><tr><th>When</th><th>Phone</th><th class="text-end">Amount</th><th>M-Pesa code</th><th>Note</th></tr></thead><tbody id="reviewBody"></tbody></table></div></div>
      </div>

      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
        <div class="tabs-x" id="vTabs"><button class="on" data-v="charts"><i class="bi bi-graph-up me-1"></i>Charts</button><button data-v="tables"><i class="bi bi-table me-1"></i>Tables &amp; downloads</button></div>
        <select id="cPeriod" class="form-select form-select-sm pill-select" aria-label="Period for the charts">
          <option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option><option value="ytd">This year so far</option><option value="365">Last 12 months</option>
        </select>
      </div>
      <div id="tabCharts"><section class="row g-3 mb-1" id="chartKpis"></section><div class="row g-3" id="chartGrid"></div></div>
      <div id="tabTables" class="d-none">
      <div class="panel">
        <div class="panel-h flex-wrap">
          <span class="label-mono">Choose a report</span>
          <div class="d-flex flex-wrap gap-2 align-items-center">
            <select id="rName" class="form-select form-select-sm pill-select" style="min-width:230px" aria-label="Report"></select>
            <input type="date" id="rFrom" class="form-control form-control-sm" style="width:150px" aria-label="From date">
            <input type="date" id="rTo" class="form-control form-control-sm" style="width:150px" aria-label="To date">
            <select id="rOrder" class="form-select form-select-sm pill-select d-none" aria-label="Order by"><option value="quantity">By quantity</option><option value="revenue">By revenue</option></select>
            <input type="number" id="rDays" min="1" class="form-control form-control-sm d-none" style="width:120px" value="60" aria-label="Days without a sale" title="Days without a sale">
            <div class="form-check form-switch d-none align-items-center gap-2 m-0 ps-0" id="rOverdueBox"><input class="form-check-input ms-0" type="checkbox" id="rOverdue" role="switch"><label for="rOverdue" class="small">Overdue only</label></div>
            <button id="rRun" class="btn btn-ink btn-sm px-3"><i class="bi bi-play-fill me-1"></i>Run</button>
          </div>
        </div>
        <div class="panel-b" id="rKpis" style="display:none"></div>
        <div class="table-responsive panel-b p-0 mt-1"><table class="table align-middle mb-0 tx"><thead id="rHead"></thead><tbody id="rBody"><tr><td class="empty">Pick a report and press Run.</td></tr></tbody><tfoot id="rFoot"></tfoot></table></div>
        <div class="d-flex justify-content-between align-items-center px-3 py-2 flex-wrap gap-2">
          <small class="text-muted mono" id="rInfo"></small>
          <div class="btn-group btn-group-sm"><button class="btn btn-light border" id="rXlsx"><i class="bi bi-file-earmark-excel me-1"></i>Excel</button><button class="btn btn-light border" id="rPdf"><i class="bi bi-file-earmark-pdf me-1"></i>PDF</button></div>
        </div>
      </div>
      </div>
    </div>
  </main>
</div>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/util.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/reports.js"></script>
<script src="js/report-charts.js"></script>
</body>
</html>
