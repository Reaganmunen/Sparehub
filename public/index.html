<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard | Spare Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/app.css" rel="stylesheet">
<link href="css/dashboard.css" rel="stylesheet">
</head>
<body class="app-body">
<div class="app">
  <aside id="sidebar" class="side offcanvas-lg offcanvas-start" tabindex="-1"></aside>
  <main class="main">
    <header class="topbar">
      <button class="btn btn-sm d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-label="Open menu"><i class="bi bi-list fs-4"></i></button>
      <div class="crumb">Dashboard <i class="bi bi-chevron-right small"></i> <b>Overview</b></div>
      <label class="search d-none d-md-block"><i class="bi bi-search"></i><input id="globalSearch" placeholder="Search sales, receipts, customers" aria-label="Search"></label>
    </header>

    <div class="page">
      <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between">
        <h1 class="h3 m-0 fw-semibold" id="hello">Welcome back</h1>
        <div class="d-flex gap-2">
          <select id="range" class="form-select form-select-sm pill-select" aria-label="Period">
            <option value="7" selected>Last 7 days</option><option value="14">Last 14 days</option><option value="30">Last 30 days</option>
          </select>
          <button id="exportBtn" class="btn btn-ink btn-sm px-3"><i class="bi bi-file-earmark-spreadsheet me-1"></i>Export Excel</button>
        </div>
      </div>

      <div id="notice" class="d-none"></div>

      <section class="row g-3" id="kpis"></section>

      <section class="row g-3">
        <div class="col-xl-8">
          <div class="panel h-100">
            <div class="panel-h"><span class="label-mono">Sales trend</span><span class="legend" id="legend"></span></div>
            <div class="panel-b">
              <div class="d-flex align-items-baseline gap-3 mb-3"><span class="label-mono">Total sales</span><span class="big mono" id="trendTotal">KES 0</span></div>
              <div class="pix-wrap"><div class="yaxis" id="yaxis"></div><div class="pix" id="pix"></div><div class="tip" id="tip"></div></div>
              <div class="xaxis" id="xaxis"></div>
            </div>
          </div>
        </div>
        <div class="col-xl-4">
          <div class="panel h-100">
            <div class="panel-h"><span class="label-mono">Best sellers</span></div>
            <div class="panel-b d-flex flex-column">
              <span class="label-mono">Top items by revenue</span><span class="big mono mb-3" id="bestTotal">KES 0</span>
              <div class="bars" id="bars"></div>
              <ol class="best" id="bestList"></ol>
            </div>
          </div>
        </div>
      </section>

      <section class="row g-3">
        <div class="col-xl-8">
          <div class="panel">
            <div class="panel-h"><span class="label-mono">Recent sales</span>
              <span class="d-flex gap-2"><input id="txSearch" class="form-control form-control-sm tx-search" placeholder="Search sales" aria-label="Search sales"><a class="btn btn-sm btn-light border" href="pos.html"><i class="bi bi-plus-lg me-1"></i>New sale</a></span></div>
            <div class="table-responsive panel-b p-0"><table class="table align-middle mb-0 tx">
              <thead><tr><th>Receipt</th><th>Customer</th><th>Shop</th><th>Cashier</th><th class="text-end">Total</th><th>Status</th></tr></thead>
              <tbody id="txBody"><tr><td colspan="6" class="text-center text-muted py-4">Loading sales</td></tr></tbody></table></div>
          </div>
        </div>
        <div class="col-xl-4">
          <div class="panel h-100">
            <div class="panel-h"><span class="label-mono">Low stock</span><span class="pill-count" id="lowCount">0</span></div>
            <div class="panel-b" id="lowList"></div>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
